name: Package MathBlitz

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/cross-platform-release']
    paths:
      - 'ios/**'
      - 'frontend/**'
      - 'scripts/stage_guest.mjs'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ios/package-lock.json
      - run: npm ci && npm run sync
        working-directory: ios
      - name: Compile unsigned iOS simulator app
        run: |
          xcodebuild -version
          xcodebuild -project ios/native/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/mathblitz-ios" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
          mkdir -p artifacts/ios
          ditto -c -k --keepParent "$RUNNER_TEMP/mathblitz-ios/Build/Products/Release-iphonesimulator/App.app" \
            artifacts/ios/MathBlitz-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MathBlitz-iOS-Simulator
          path: artifacts/ios/MathBlitz-iOS-Simulator.zip
          if-no-files-found: error
